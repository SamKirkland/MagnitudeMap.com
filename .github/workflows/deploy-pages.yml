# Build the Vite SPA and publish dist/ to GitHub Pages (magnitudemap.com).
# Settings → Pages → Source: GitHub Actions. Custom domain is set in the repo UI.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Static build only. `npm run build` also runs Playwright/WebGL OG capture,
      # which is unreliable on Actions runners. Committed public/og/*.jpg is copied to dist.
      - name: Build
        run: npm run build:static

      - name: Prepare Pages files
        run: |
          touch dist/.nojekyll
          echo 'magnitudemap.com' > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
